<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="fragments :: page_head('Forgot Password', 'none')">
</head>

<body>
	<div class="container-fluid text-center">
		<div th:replace="navigation :: header_menu"></div>
				<div>&nbsp;</div>
		
		<div>
			<h1>Forgot Password</h1>
		</div>
			<div>&nbsp;</div>
	
	<div th:if="${error != null}">
			<p class="text-danger">[[${error}]]</p>
	</div>
	<div th:if="${message != null}">
		<p class="text-warning">[[${message}]]</p>
	</div>	
		<form th:action="@{/forgot_password}" method="post" style="max-width:420px; margin: 0 auto">
		<div class="border border-secondary rounded p-2">
		
			<div>
				<p>We will be sending a reset password link to your email.</p>
			</div>
			<div>
				<p>
					<input type="email" name="email" class="form-control" required="required" autofocus="autofocus" placeholder="enter your email">
				</p>
			</div>
			<div>
				<p>
					<input type="submit" value="Send" class="btn btn-primary">
				</p>
			</div>
		</div>	
		</form>
		<div>&nbsp;</div>
		<div th:replace="navigation :: footer_menu"></div>
	</div>
</body>

</html>
