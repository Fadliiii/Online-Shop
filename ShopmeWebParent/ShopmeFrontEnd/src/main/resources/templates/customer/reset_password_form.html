<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:replace="fragments :: page_head('Forgot Password', 'none')">
</head>

<body>
	<div class="container-fluid text-center">
		<div th:replace="navigation :: header_menu"></div>
		<div>&nbsp;</div>

		<div>
			<h1>Reset Password</h1>
		</div>
		<div>&nbsp;</div>

		<div th:if="${error != null}">
			<p class="text-danger">[[${error}]]</p>
		</div>
		<div th:if="${message != null}">
			<p class="text-warning">[[${message}]]</p>
		</div>

		<form th:action="@{/reset_password}" method="post"
			style="max-width: 420px; margin: 0 auto">
			<input type="hidden" name="token" th:value="${token}" />
			<div class="border border-secondary rounded p-2" >

				<div>
					<p>
						<input type="password" name="password"
							id="password"
							placeholder="Enter your new password" class="form-control"
							minlength="8" maxlength="15" required="required"
							autofocus="autofocus">
					</p>
				</div>
				<div>
					<p>
						<input type="password" placeholder="Confirm your new password"
							class="form-control" minlength="8" maxlength="15" oninput="checkPasswordMatch(this)"
							required="required">
					</p>
				</div>
				<div>
					<p>
						<input type="submit" value="Change Password"
							class="btn btn-primary">
					</p>
				</div>
			</div>
		</form>

		<div>&nbsp;</div>
		<div th:replace="navigation :: footer_menu"></div>
	</div>
<script type="text/javascript">
function checkPasswordMatch(confirmPassword){
	if (confirmPassword.value != $("#password").val()){
		confirmPassword.setCustomValidity("Password do not match!");
	}else{
		confirmPassword.setCustomValidity("");
		}
	}
</script>
</body>

</html>
